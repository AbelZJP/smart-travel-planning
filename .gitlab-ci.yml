stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "你的服务器IP"
  DEPLOY_USER: "root"
  DEPLOY_PATH: "/opt/travel-planning"
  FRONTEND_PATH: "/var/www/travel-planning"

# ---- 前端构建 ----
build-frontend:
  stage: build
  image: node:18-alpine
  cache:
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - cd frontend
    - echo "VITE_AMAP_KEY=$VITE_AMAP_KEY" > .env
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  only:
    - main

# ---- 部署 ----
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    # 部署前端静态文件
    - rsync -avz --delete frontend/dist/ $DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_PATH/
    # 部署后端代码
    - rsync -avz --delete --exclude='venv' --exclude='__pycache__' --exclude='.env' backend/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
    # 重启后端服务
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && source venv/bin/activate && pip install -r requirements.txt -q && sudo systemctl restart travel-planning"
  only:
    - main
