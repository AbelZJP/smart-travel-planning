name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 前端构建 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          echo "VITE_AMAP_KEY=${{ secrets.VITE_AMAP_KEY }}" > .env
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # ---- 部署到服务器 ----
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Deploying frontend ==="
            rm -rf /www/travel-planning/*
            echo "=== Deploying backend ==="
            mkdir -p /opt/travel-planning

      - name: Rsync Frontend
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend/dist/
          remote_path: /www/travel-planning/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync Backend
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='venv' --exclude='__pycache__' --exclude='.env' --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal'
          path: backend/
          remote_path: /opt/travel-planning/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/travel-planning
            source venv/bin/activate
            pip install -r requirements.txt -q
            sudo systemctl restart travel-planning
            echo "=== Deploy done ==="
